<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hikaru's math</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one centered column on graph paper; chunky sticker buttons with hard shadows. */
:root{
  --paper:#f3f6ff; --grid:#dbe3fb; --ink:#13204b; --muted:#56628f; --card:#ffffff; --edge:#13204b;
  --blue:#2a58ff; --on-blue:#ffffff; --gold:#ffb400; --good:#0f9d63; --bad:#df3550; --soft:#e6ecff;
  --l0:#18a864; --l1:#1a8fd6; --l2:#e3a008; --l3:#ea5a1f; --l4:#c2257a;
  --display:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d132e; --grid:#19224a; --ink:#edf0ff; --muted:#a0abda; --card:#162047; --edge:#7d90ff;
    --blue:#4b74ff; --gold:#ffc53d; --good:#35d08a; --bad:#ff6b80; --soft:#1e2a5c;
    --l0:#35d08a; --l1:#4cb3ff; --l2:#ffc53d; --l3:#ff8a4d; --l4:#ff6fb5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d132e; --grid:#19224a; --ink:#edf0ff; --muted:#a0abda; --card:#162047; --edge:#7d90ff;
  --blue:#4b74ff; --gold:#ffc53d; --good:#35d08a; --bad:#ff6b80; --soft:#1e2a5c;
  --l0:#35d08a; --l1:#4cb3ff; --l2:#ffc53d; --l3:#ff8a4d; --l4:#ff6fb5; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--body); font-weight:600; font-size:16px; min-height:100vh;
  padding-block:8px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.screen{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.spacer{width:48px}
.icon{width:48px;height:48px;border-radius:14px;border:3px solid var(--edge);background:var(--card);font-size:22px;box-shadow:0 4px 0 var(--edge)}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.coins{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:6px 14px 6px 8px;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--gold);border:3px solid var(--edge);position:relative}
.coin::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid var(--edge);opacity:.45}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:clamp(44px,13vw,64px)}
h2{font-size:clamp(30px,8vw,38px)}
p{margin:0;line-height:1.45}
.muted{color:var(--muted)}
.brand{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.sum{display:inline-flex;align-self:flex-start;gap:10px;font-family:var(--display);font-size:22px;background:var(--card);border:3px solid var(--edge);border-radius:12px;padding:6px 14px;transform:rotate(-2deg);box-shadow:0 4px 0 var(--edge)}
.sum b{color:var(--blue);font-weight:400}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{font-family:var(--display);font-size:24px;line-height:1.1;padding:18px 20px;border:3px solid var(--edge);border-radius:18px;background:var(--blue);color:var(--on-blue);box-shadow:0 6px 0 var(--edge);text-align:center}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.go{background:var(--good);color:#06210f}
.btn small{display:block;font-family:var(--body);font-size:14px;font-weight:600;opacity:.9;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:8px 16px;font-weight:800}
.lv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:var(--card);border:3px solid var(--edge);border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 var(--edge)}
.lv:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.lvname{font-family:var(--display);font-size:24px}
.lvtag{grid-column:1;color:var(--muted);font-size:14px}
.pips{display:flex;gap:4px;justify-self:end}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--edge);background:transparent}
.pips i.on{background:var(--c)}
.rate{grid-column:2;grid-row:2;justify-self:end;font-size:14px;font-weight:800}
.meter{height:14px;border:3px solid var(--edge);border-radius:999px;background:var(--card);overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:var(--blue);transition:width .1s linear}
.meter.bot i{background:var(--l3)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--muted)}
.qcard{background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:18px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 var(--edge)}
.q{font-family:var(--display);font-size:clamp(40px,12vw,60px);line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ans{font-family:var(--display);font-size:clamp(34px,10vw,46px);min-height:1.3em;border-top:3px dashed var(--grid);padding-top:8px;color:var(--blue);font-variant-numeric:tabular-nums}
.ans.empty{color:var(--muted);opacity:.6}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:28px;text-align:center;font-weight:800;font-size:18px}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{font-family:var(--display);font-size:30px;padding:12px 0;border:3px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:0 5px 0 var(--edge);touch-action:manipulation}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.key.ok{background:var(--good);color:#06210f}
.key.del{background:var(--gold);color:#2b1c00}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score b{font-family:var(--display);font-weight:400;font-size:44px;font-variant-numeric:tabular-nums}
.score span{font-weight:800;overflow-wrap:anywhere}
.big{font-family:var(--display);font-size:clamp(54px,16vw,84px);line-height:1}
.card{background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--edge)}
.center{align-items:center;text-align:center}
.av{width:72px;height:72px;border-radius:50%;border:3px solid var(--edge);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:34px}
.av.sm{width:38px;height:38px;font-size:18px;flex:none}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:800}
.dot{width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid var(--edge)}
.dot.off{background:var(--muted)}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--grid);border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rows{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--edge);border-radius:14px;padding:8px 12px;min-width:0}
.row.me{background:var(--gold);color:#2b1c00}
.row .pos{font-family:var(--display);width:34px;font-size:20px;text-align:center;flex:none}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:800}
.row .ct{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.ping{display:flex;justify-content:space-between;gap:10px}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.shake{animation:none}.meter i{transition:none}}
</style>
<div id="app"></div>
<script>
(function(){
var app=document.getElementById('app');
function $(s){return document.querySelector(s)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}

/* saved progress (this browser only) */
var save={coins:0,played:0,wins:0};
try{var s0=JSON.parse(localStorage.getItem('hikaru-math')||'null');if(s0&&typeof s0.coins==='number'){save=s0}}catch(e){}
function persist(){try{localStorage.setItem('hikaru-math',JSON.stringify(save))}catch(e){}}

var LV=[
 {name:'Easy',tag:'Add and subtract up to 20',rate:1,time:20,c:'var(--l0)'},
 {name:'Medium',tag:'Bigger sums and the 2 to 5 times tables',rate:2,time:25,c:'var(--l1)'},
 {name:'Hard',tag:'Times tables up to 12',rate:3,time:25,c:'var(--l2)'},
 {name:'Extreme Hard',tag:'Division, 2-digit times 1-digit, 3-digit sums',rate:5,time:35,c:'var(--l3)'},
 {name:'Very Very Hard',tag:'2-digit times 2-digit, squares, mixed sums',rate:8,time:50,c:'var(--l4)'}
];
var NAMES=[['Mia',600],['Kenji',520],['Sofia',450],['Lucas',380],['Yui',320],['Omar',260],['Ava',200],['Ren',150],['Noah',100],['Lily',60],['Sam',30]];
var BOTS=NAMES.map(function(n,i){return{n:n[0],c:n[1],i:i,lo:6+i*0.9}});

function gen(l){
  var a,b,c,d,k,t;
  if(l===0){
    if(Math.random()<.5){a=rnd(1,10);b=rnd(1,10);return{t:a+' + '+b,a:a+b}}
    a=rnd(5,20);b=rnd(1,a);return{t:a+' − '+b,a:a-b};
  }
  if(l===1){
    k=rnd(0,2);
    if(k===0){a=rnd(10,60);b=rnd(5,39);return{t:a+' + '+b,a:a+b}}
    if(k===1){a=rnd(20,99);b=rnd(5,a);return{t:a+' − '+b,a:a-b}}
    a=rnd(2,5);b=rnd(2,10);return{t:a+' × '+b,a:a*b};
  }
  if(l===2){
    if(Math.random()<.6){a=rnd(3,12);b=rnd(3,12);return{t:a+' × '+b,a:a*b}}
    a=rnd(25,99);b=rnd(15,99);
    if(Math.random()<.5)return{t:a+' + '+b,a:a+b};
    if(a<b){t=a;a=b;b=t}
    return{t:a+' − '+b,a:a-b};
  }
  if(l===3){
    k=rnd(0,2);
    if(k===0){a=rnd(11,99);b=rnd(3,9);return{t:a+' × '+b,a:a*b}}
    if(k===1){b=rnd(3,12);c=rnd(3,12);return{t:(b*c)+' ÷ '+b,a:c}}
    a=rnd(120,899);b=rnd(110,799);
    if(Math.random()<.5)return{t:a+' + '+b,a:a+b};
    if(a<b){t=a;a=b;b=t}
    return{t:a+' − '+b,a:a-b};
  }
  k=rnd(0,3);
  if(k===0){a=rnd(12,39);b=rnd(11,29);return{t:a+' × '+b,a:a*b}}
  if(k===1){a=rnd(11,25);return{t:a+'²',a:a*a}}
  if(k===2){a=rnd(3,15);b=rnd(3,15);c=rnd(3,9);return{t:'('+a+' + '+b+') × '+c,a:(a+b)*c}}
  a=rnd(5,12);b=rnd(5,12);c=rnd(2,5);d=rnd(2,5);
  return{t:a+' × '+b+' − '+c+' × '+d,a:a*b-c*d};
}

/* timers and state */
var timers=[],G=null,B=null,lastLevel=0;
function later(fn,ms){var id=setTimeout(fn,ms);timers.push(id);return id}
function every(fn,ms){var id=setInterval(fn,ms);timers.push(id);return id}
function stopAll(){timers.forEach(function(id){clearTimeout(id);clearInterval(id)});timers=[];G=null;B=null}

function board(){
  var l=BOTS.map(function(b){return{n:b.n,c:b.c,me:false}});
  l.push({n:'Hikaru',c:save.coins,me:true});
  l.sort(function(x,y){return y.c-x.c||(y.me?1:0)-(x.me?1:0)});
  return l;
}
function myRank(){var l=board();for(var i=0;i<l.length;i++)if(l[i].me)return i+1;return l.length}
function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
function av(n,sm){return '<div class="av'+(sm?' sm':'')+'" style="background:hsl('+hue(n)+',65%,38%)" aria-hidden="true">'+n.charAt(0)+'</div>'}
function setCoins(){var b=$('#coins b');if(b)b.textContent=save.coins}

function top(back){
  return '<header class="top">'+(back?'<button class="icon" data-act="'+back+'" aria-label="Back">←</button>':'<span class="spacer"></span>')+
  '<div class="coins" id="coins" aria-label="Coins"><span class="coin"></span><b>'+save.coins+'</b></div></header>';
}
var keys=['7','8','9','4','5','6','1','2','3','back','0','ok'];
function pad(){
  return '<div class="pad">'+keys.map(function(k){
    return '<button class="key'+(k==='ok'?' ok':k==='back'?' del':'')+'" data-k="'+k+'" aria-label="'+(k==='back'?'Delete':k==='ok'?'Submit answer':k)+'">'+(k==='back'?'⌫':k==='ok'?'OK':k)+'</button>';
  }).join('')+'</div>';
}

/* screens */
function drawHome(){
  stopAll();
  var r=myRank();
  app.innerHTML='<main class="screen">'+top()+
  '<div class="brand"><div class="sum" aria-hidden="true"><span>7 × 8</span><b>=</b><span>56</span></div><h1>Hikaru\'s math</h1><p class="muted">Answer fast, earn coins, and climb to number 1.</p></div>'+
  '<div class="stack"><button class="btn" data-act="single">Singleplayer<small>Five levels, from Easy to Very Very Hard</small></button>'+
  '<button class="btn alt" data-act="multi">Multiplayer<small>Battle another player</small></button></div>'+
  '<button class="chip" data-act="ranks">Rank #'+r+' of '+(BOTS.length+1)+' · see the leaderboard</button></main>';
}
function drawLevels(){
  stopAll();
  var h='<main class="screen">'+top('home')+'<h2>Pick a level</h2><div class="stack">';
  LV.forEach(function(L,i){
    var p='';for(var j=0;j<5;j++)p+='<i'+(j<=i?' class="on"':'')+'></i>';
    h+='<button class="lv" style="--c:'+L.c+'" data-act="lv" data-v="'+i+'"><span class="lvname">'+L.name+'</span><span class="pips" aria-hidden="true">'+p+'</span><span class="lvtag">'+L.tag+'</span><span class="rate">+'+L.rate+' per answer</span></button>';
  });
  app.innerHTML=h+'</div></main>';
}
function drawMulti(){
  stopAll();
  app.innerHTML='<main class="screen">'+top('home')+'<h2>Multiplayer</h2>'+
  '<div class="stack"><button class="btn go" data-act="find">Battle<small>Find a player and race to the answer. Best of 5 rounds.</small></button>'+
  '<button class="btn alt" data-act="ranks">Leaderboard</button></div>'+
  '<p class="note">The other players in the lobby are practice opponents controlled by the game, so someone is always around to battle.</p></main>';
}

/* single player */
function startSingle(l){
  stopAll();lastLevel=l;
  G={mode:'s',l:l,i:0,n:10,ok:0,earn:0,input:'',locked:true,submit:submitSingle};
  nextQ();
}
function nextQ(){
  if(!G)return;
  if(G.i>=G.n)return finishSingle();
  G.q=gen(G.l);G.i++;G.input='';G.locked=false;G.t0=Date.now();G.limit=LV[G.l].time*1000;
  app.innerHTML='<main class="screen">'+top('levels')+
  '<div class="meter" aria-hidden="true"><i id="bar"></i></div>'+
  '<div class="qmeta"><span>Question '+G.i+' of '+G.n+'</span><span>'+LV[G.l].name+'</span></div>'+
  '<div class="qcard"><div class="q">'+G.q.t+'</div><div class="ans empty" id="ans">?</div></div>'+
  '<div class="fb" id="fb" role="status"></div>'+pad()+'</main>';
  G.tick=every(tickSingle,100);
}
function tickSingle(){
  if(!G||G.locked)return;
  var left=G.limit-(Date.now()-G.t0),bar=$('#bar');
  if(bar)bar.style.width=Math.max(0,left/G.limit*100)+'%';
  if(left<=0){lockSingle();fb('Time is up. The answer is '+G.q.a,'bad');later(nextQ,1700)}
}
function lockSingle(){G.locked=true;clearInterval(G.tick)}
function fb(t,c){var f=$('#fb');if(f){f.textContent=t;f.className='fb '+c}}
function submitSingle(){
  if(!G||G.locked||!G.input)return;
  if(+G.input===G.q.a){
    var r=LV[G.l].rate;G.ok++;G.earn+=r;save.coins+=r;persist();setCoins();
    lockSingle();fb('Correct! +'+r+(r>1?' coins':' coin'),'good');later(nextQ,800);
  }else{
    lockSingle();fb('Not quite. The answer is '+G.q.a,'bad');later(nextQ,1700);
  }
}
function finishSingle(){
  var L=LV[G.l],bonus=0,ok=G.ok,earn=G.earn;
  if(ok===G.n){bonus=L.rate*5;save.coins+=bonus}
  save.played++;persist();
  var r=myRank(),msg=ok===10?'Perfect score!':ok>=7?'Great work!':ok>=4?'Good try!':'Keep practicing!';
  var h='<main class="screen">'+top('levels')+'<div class="card center"><h2>'+msg+'</h2><div class="big">'+ok+'/'+G.n+'</div><p class="muted">'+L.name+' level</p>'+
  '<div class="ping"><span>Coins earned</span><b>+'+(earn+bonus)+'</b></div>'+(bonus?'<p class="muted">Includes +'+bonus+' for a perfect score.</p>':'')+
  '<p>'+(r===1?'You are number 1 on the leaderboard!':'You are rank #'+r+' of '+(BOTS.length+1)+'.')+'</p></div>'+
  '<div class="stack"><button class="btn" data-act="lv" data-v="'+G.l+'">Play again</button><button class="btn alt" data-act="single">Choose level</button><button class="btn alt" data-act="ranks">Leaderboard</button></div></main>';
  stopAll();app.innerHTML=h;
}

/* multiplayer */
function startSearch(){
  stopAll();B={tried:[],off:0,live:false};
  drawSearch('Searching for a player…');
  later(tryNext,1400);
}
function drawSearch(msg,p){
  app.innerHTML='<main class="screen">'+top('multi')+'<div class="card center"><div class="spin" role="status" aria-label="Searching"></div>'+
  (p?av(p.n):'')+'<h2>'+msg+'</h2></div></main>';
}
function tryNext(){
  if(!B)return;
  var pool=BOTS.filter(function(b){return B.tried.indexOf(b.n)<0});
  if(!pool.length){B.tried=[];pool=BOTS.slice()}
  var p=pool[rnd(0,pool.length-1)];B.tried.push(p.n);B.opp=p;
  var online=Math.random()>.4||B.off>=3;
  if(!online){B.off++;drawSearch(p.n+' is offline. Looking for someone else…',p);later(tryNext,1700)}
  else{B.off=0;drawFound(p)}
}
function rankOf(n){var l=board();for(var i=0;i<l.length;i++)if(l[i].n===n)return i+1;return 0}
function drawFound(p){
  app.innerHTML='<main class="screen">'+top('multi')+'<div class="card center">'+av(p.n)+'<h2>'+p.n+'</h2>'+
  '<span class="status"><span class="dot"></span>Online</span><p class="muted">Rank #'+rankOf(p.n)+' · '+p.c+' coins</p></div>'+
  '<div class="stack"><button class="btn go" data-act="challenge">Challenge '+p.n+'</button><button class="btn alt" data-act="other">Find someone else</button></div></main>';
}
function challenge(){
  if(!B)return;var p=B.opp;
  app.innerHTML='<main class="screen">'+top('multi')+'<div class="card center"><div class="spin" role="status" aria-label="Waiting"></div>'+av(p.n)+'<h2>Waiting for '+p.n+' to answer…</h2></div></main>';
  later(function(){
    if(Math.random()<.7){
      app.innerHTML='<main class="screen">'+top('multi')+'<div class="card center">'+av(p.n)+'<h2>'+p.n+' said yes!</h2><p class="muted">Get ready.</p></div></main>';
      later(startBattle,1100);
    }else{
      app.innerHTML='<main class="screen">'+top('multi')+'<div class="card center">'+av(p.n)+'<h2>'+p.n+' ignored your challenge</h2><p class="muted">Looking for someone else…</p></div></main>';
      later(tryNext,1800);
    }
  },2200);
}
function startBattle(){
  if(!B)return;
  B.r=0;B.rounds=5;B.you=0;B.them=0;B.live=false;B.submit=submitBattle;
  nextRound();
}
function nextRound(){
  if(!B)return;
  if(B.r>=B.rounds)return finishBattle();
  B.r++;B.q=gen(2);B.input='';B.over=false;B.botDone=false;B.t0=Date.now();B.live=true;B.locked=false;
  B.botMs=rnd(B.opp.lo*1000,(B.opp.lo+5)*1000);
  B.botRight=Math.random()<(0.95-B.opp.i*0.02);
  B.limit=40000;
  var o=B.opp;
  app.innerHTML='<main class="screen">'+top('multi')+
  '<div class="score"><span>You</span><b id="sc">'+B.you+' – '+B.them+'</b><span>'+o.n+'</span></div>'+
  '<div class="qmeta"><span>Round '+B.r+' of '+B.rounds+'</span><span id="bstat">'+o.n+' is thinking…</span></div>'+
  '<div class="meter bot" aria-hidden="true"><i id="bbar" style="width:0"></i></div>'+
  '<div class="qcard" id="qcard"><div class="q">'+B.q.t+'</div><div class="ans empty" id="ans">?</div></div>'+
  '<div class="fb" id="fb" role="status"></div>'+pad()+'</main>';
  B.tick=every(tickBattle,100);
}
function tickBattle(){
  if(!B||B.over)return;
  var el=Date.now()-B.t0,bar=$('#bbar');
  if(bar)bar.style.width=Math.min(100,el/B.botMs*100)+'%';
  if(!B.botDone&&el>=B.botMs){
    B.botDone=true;
    if(B.botRight){endRound('them');return}
    var s=$('#bstat');if(s)s.textContent=B.opp.n+' got stuck';
  }
  if(el>=B.limit)endRound('none');
}
function submitBattle(){
  if(!B||B.over||!B.input)return;
  if(+B.input===B.q.a){endRound('you')}
  else{
    B.input='';showInput();
    var c=$('#qcard');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
    fb('Not that one. Try again!','bad');
  }
}
function endRound(w){
  B.over=true;B.live=false;clearInterval(B.tick);
  var m;
  if(w==='you'){B.you++;save.coins+=5;persist();setCoins();m='You got it first! +5 coins'}
  else if(w==='them'){B.them++;m=B.opp.n+' got it first. The answer is '+B.q.a}
  else m='Time is up. The answer is '+B.q.a;
  var sc=$('#sc');if(sc)sc.textContent=B.you+' – '+B.them;
  fb(m,w==='you'?'good':'bad');
  later(nextRound,1900);
}
function finishBattle(){
  var win=B.you>B.them,draw=B.you===B.them,o=B.opp,reward=win?30:draw?10:5;
  save.coins+=reward;save.played++;if(win)save.wins++;persist();
  var r=myRank();
  var h='<main class="screen">'+top('multi')+'<div class="card center">'+av(o.n)+'<h2>'+(win?'You beat '+o.n+'!':draw?'It\'s a draw with '+o.n:o.n+' won this time')+'</h2>'+
  '<div class="big">'+B.you+' – '+B.them+'</div><div class="ping"><span>Match reward</span><b>+'+reward+'</b></div>'+
  '<p>'+(r===1?'You are number 1 on the leaderboard!':'You are rank #'+r+' of '+(BOTS.length+1)+'.')+'</p></div>'+
  '<div class="stack"><button class="btn go" data-act="find">Battle again</button><button class="btn alt" data-act="ranks">Leaderboard</button><button class="btn alt" data-act="home">Home</button></div></main>';
  stopAll();app.innerHTML=h;
}

function drawRanks(){
  stopAll();
  var l=board(),h='<main class="screen">'+top('home')+'<h2>Leaderboard</h2>'+
  (l[0].me?'<p>You are number 1. Keep playing to stay on top!</p>':'<p class="muted">Earn '+(l[0].c-save.coins+1)+' more coins to reach number 1.</p>')+'<ol class="rows">';
  l.forEach(function(x,i){
    h+='<li class="row'+(x.me?' me':'')+'"><span class="pos">'+(i===0?'♛':i+1)+'</span>'+av(x.n,true)+'<span class="nm">'+(x.me?'Hikaru (you)':x.n)+'</span><span class="ct"><span class="coin"></span>'+x.c+'</span></li>';
  });
  app.innerHTML=h+'</ol></main>';
}

/* input */
function cur(){return G&&G.mode==='s'?G:(B&&B.live?B:null)}
function showInput(){
  var c=cur(),el=$('#ans');if(!c||!el)return;
  el.textContent=c.input||'?';el.className='ans'+(c.input?'':' empty');
}
function key(k){
  var c=cur();if(!c||c.locked||c.over)return;
  if(k==='back')c.input=c.input.slice(0,-1);
  else if(k==='ok'){c.submit();return}
  else if(c.input.length<6)c.input+=k;
  showInput();
}
function act(a,v){
  if(a==='home')drawHome();
  else if(a==='single'||a==='levels')drawLevels();
  else if(a==='lv')startSingle(+v);
  else if(a==='multi')drawMulti();
  else if(a==='find')startSearch();
  else if(a==='other'){drawSearch('Searching for a player…');later(tryNext,1200)}
  else if(a==='challenge')challenge();
  else if(a==='ranks')drawRanks();
}
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-k],[data-act]');if(!t)return;
  if(t.dataset.k){key(t.dataset.k);return}
  act(t.dataset.act,t.dataset.v);
});
document.addEventListener('keydown',function(e){
  if(!cur())return;
  if(/^[0-9]$/.test(e.key)){key(e.key)}
  else if(e.key==='Backspace'){e.preventDefault();key('back')}
  else if(e.key==='Enter'){e.preventDefault();key('ok')}
});
drawHome();
})();
</script>

</body></html>
